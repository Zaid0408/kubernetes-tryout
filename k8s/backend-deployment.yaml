apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-deployment
  labels:
    app: backend
spec: 
  replicas: 2 # Run 2 backend pods
  selector: 
    matchLabels:
      app: backend
  template: 
    metadata: 
      labels:
        app: backend
    spec: 
      containers: 
        - name: backend
          image: login-backend:latest
          imagePullPolicy: Never
          ports: 
            - containerPort: 8000
          resources: 
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 3
